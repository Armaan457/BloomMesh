<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomMesh - Distributed Cluster Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0d13;
      background-image: radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.25) 0%, rgba(15, 23, 42, 0.1) 40%, #0b0d13 80%);
      background-attachment: fixed;
    }
    #logContainer::-webkit-scrollbar {
      width: 6px;
    }
    #logContainer::-webkit-scrollbar-track {
      background: #090a0f;
      border-radius: 4px;
    }
    #logContainer::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    #logContainer::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>
<body class="text-zinc-100 min-h-screen font-sans antialiased p-3 sm:p-5 md:p-8 selection:bg-zinc-800 selection:text-zinc-200">
  <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-800/80 pb-4 sm:pb-5 gap-4">
      <div>
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <div id="connectionDot" class="w-2 h-2 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shrink-0"></div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2.5">
            <span>BloomMesh</span>
            <span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded-md bg-zinc-800/80 text-zinc-400 border border-zinc-700/60 uppercase tracking-wider hidden sm:inline">
              Cluster Visualizer
            </span>
          </h1>
          <span id="connectionBadge" class="text-xs px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium shrink-0">
            Connecting WebSocket...
          </span>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="addRandomNode()" class="px-3 py-1.5 text-xs font-medium bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 hover:text-white rounded-lg border border-zinc-700/80 transition-colors shadow-sm">
          + Add Node
        </button>
        <button onclick="syncAllNodes()" class="px-3 py-1.5 text-xs font-medium bg-zinc-800/90 hover:bg-zinc-700 text-zinc-200 hover:text-white rounded-lg border border-zinc-700/80 transition-colors shadow-sm flex items-center gap-1.5">
          <span>↺</span> Anti-Entropy Sync
        </button>
      </div>
    </header>

    <!-- Controls Bar -->
    <div class="bg-zinc-900/80 border border-zinc-800 rounded-xl p-4 sm:p-5 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
        <div class="md:col-span-6 lg:col-span-5 space-y-1.5">
          <label class="text-xs font-medium text-zinc-400 uppercase tracking-wider font-mono">
            Item / Key
          </label>
          <input id="keyInput" type="text" value="user:101" placeholder="e.g. user:42" 
                 class="w-full bg-zinc-950 border border-zinc-800 hover:border-zinc-700 focus:border-rose-500/70 rounded-lg px-3.5 py-2 text-sm text-zinc-100 placeholder-zinc-500 font-mono focus:outline-none transition">
        </div>

        <div class="md:col-span-3 lg:col-span-3 space-y-1.5">
          <label class="text-xs font-medium text-zinc-400 uppercase tracking-wider font-mono">
            Consistency Level
          </label>
          <select id="repSelect" class="w-full bg-zinc-950 border border-zinc-800 hover:border-zinc-700 focus:border-amber-500/70 rounded-lg px-3 py-2 text-sm text-zinc-100 font-mono focus:outline-none transition">
            <option value="single">1 (Single node)</option>
            <option value="primary_plus_one">2 (Primary+1)</option>
            <option value="quorum" selected>3 (Quorum)</option>
            <option value="all">4 (ALL)</option>
          </select>
        </div>

        <div class="md:col-span-3 lg:col-span-4 flex flex-col sm:flex-row gap-2 sm:gap-2.5">
          <button onclick="performAdd()" class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white font-medium py-2 px-3.5 rounded-lg border border-rose-500/40 shadow-sm transition-all flex items-center justify-center gap-1.5 text-sm">
            <span>+</span> Add (Write)
          </button>
          <button onclick="performContains()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 active:scale-[0.98] text-zinc-100 hover:text-white font-medium py-2 px-3.5 rounded-lg border border-zinc-700 shadow-sm transition-all flex items-center justify-center gap-1.5 text-sm">
            Check (Query)
          </button>
        </div>
      </div>
    </div>

    <!-- Main Grid: Ring & Node Cards -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- Left Column: Hash Ring Visualization -->
      <div class="lg:col-span-5 self-start lg:sticky lg:top-6 bg-zinc-900/80 border border-zinc-800 rounded-xl p-4 sm:p-5 flex flex-col items-center shadow-sm">
        <div class="w-full flex justify-between items-center mb-2">
          <h2 class="text-xs sm:text-sm font-semibold text-zinc-300 uppercase tracking-wider font-mono">
            Live Hash Ring (360°)
          </h2>
          <span id="ringKeyInfo" class="text-xs text-zinc-400 font-mono truncate max-w-[160px]"></span>
        </div>
        
        <div class="relative w-full max-w-[300px] aspect-square flex items-center justify-center my-2">
          <canvas id="ringCanvas" width="340" height="340" class="w-full h-full"></canvas>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-4">
            <span class="text-[11px] text-zinc-400 uppercase tracking-wider font-mono font-medium">Cluster Ring</span>
            <span id="centerStatus" class="text-base sm:text-lg font-bold text-zinc-100 mt-0.5 font-mono">4 Active Nodes</span>
            <span id="centerVnodes" class="text-xs text-zinc-500 font-mono">Loading vnodes...</span>
          </div>
        </div>
      </div>

      <!-- Right Column: Node Cluster Cards -->
      <div class="lg:col-span-7 flex flex-col gap-4">
        <!-- Operation Result Card -->
        <div id="operationResultCard" class="hidden bg-zinc-900/80 border border-zinc-800 rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <span id="resultBadge" class="px-2 py-0.5 rounded text-xs font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0">OK</span>
            <span id="resultLatency" class="text-xs text-zinc-500 font-mono shrink-0">0.0ms</span>
          </div>
          <div class="mt-3 text-xs bg-zinc-950/80 p-3 rounded-lg border border-zinc-800/80 font-mono space-y-1.5">
            <div><span class="text-zinc-500">Key:</span> <span id="opKey" class="text-zinc-100 font-semibold break-all"></span></div>
            <div><span class="text-zinc-500">Consistency:</span> <span id="opMode" class="text-rose-400 font-medium"></span></div>
            <div><span class="text-zinc-500">Target Replicas:</span> <span id="opReplicas" class="text-zinc-300 font-medium break-all"></span></div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 sm:gap-4">
          <h2 class="text-xs sm:text-sm font-semibold text-zinc-300 uppercase tracking-wider font-mono">
            Live TCP Bloom Nodes
          </h2>
          <span class="text-xs text-zinc-500 font-mono">Click button to toggle node socket</span>
        </div>

        <div id="nodesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <!-- Dynamically populated from Python WebSocket state -->
        </div>
      </div>
    </div>

    <!-- Bottom: Live Event Log -->
    <div class="bg-zinc-900/80 border border-zinc-800 rounded-xl p-4 shadow-sm">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider font-mono">
          Live Socket Protocol Stream
        </h3>
        <button onclick="clearLogs()" class="text-xs text-zinc-500 hover:text-zinc-300 font-mono transition">Clear</button>
      </div>
      <div id="logContainer" class="bg-zinc-950/90 rounded-lg p-3 min-h-[3.5rem] max-h-48 overflow-y-auto font-mono text-xs space-y-1 text-zinc-300 border border-zinc-800/80">
        <div class="text-zinc-600 italic">Waiting for cluster events...</div>
      </div>
    </div>

  </div>

  <script>
    // Balanced, refined palette for node identity
    const NODE_PALETTE = ['#38bdf8', '#818cf8', '#34d399', '#fb7185', '#fbbf24', '#c084fc'];

    let ws = null;
    let clusterNodes = [];
    let vnodeRing = [];

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = window.location.host || '127.0.0.1:8000';
      ws = new WebSocket(`${protocol}//${host}/ws`);

      ws.onopen = () => {
        document.getElementById('connectionDot').className = 'w-2 h-2 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shrink-0';
        document.getElementById('connectionBadge').className = 'text-xs px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium shrink-0';
        document.getElementById('connectionBadge').textContent = 'Cluster Connected';
        log('WebSocket connected to Python FastAPI backend.', 'info');
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'state') {
          clusterNodes = msg.nodes;
          vnodeRing = msg.vnodes;
          renderNodes();
          drawRing();
          updateStats();
        } else if (msg.type === 'op_result') {
          handleOpResult(msg);
        } else if (msg.type === 'log') {
          log(msg.message, 'info');
        }
      };

      ws.onclose = () => {
        document.getElementById('connectionDot').className = 'w-2 h-2 rounded-full bg-red-400 ring-4 ring-red-500/20 shrink-0';
        document.getElementById('connectionBadge').className = 'text-xs px-2.5 py-0.5 rounded-md bg-red-500/10 text-red-400 border border-red-500/20 font-mono font-medium shrink-0';
        document.getElementById('connectionBadge').textContent = 'Disconnected (Retrying...)';
        log('WebSocket connection closed. Retrying in 2s...', 'err');
        setTimeout(connectWebSocket, 2000);
      };
    }

    function drawRing() {
      const canvas = document.getElementById('ringCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = 125;

      ctx.clearRect(0, 0, w, h);

      // Clean, muted titanium ring track
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 8;
      ctx.stroke();

      // Sample virtual node markers to keep the ring clean and avoid dot clutter (~28 dots)
      const targetDots = 28;
      const step = Math.max(1, Math.round(vnodeRing.length / targetDots));
      const dotsToDraw = vnodeRing.filter((_, idx) => idx % step === 0);

      dotsToDraw.forEach(vn => {
        const angle = vn.hash * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;

        const nodeIdx = clusterNodes.findIndex(n => n.id === vn.nodeId);
        const node = clusterNodes.find(n => n.id === vn.nodeId);
        const isOnline = node ? node.online : true;
        const color = isOnline 
          ? (nodeIdx >= 0 ? NODE_PALETTE[nodeIdx % NODE_PALETTE.length] : '#94a3b8') 
          : '#3f3f46';

        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      });
    }

    function renderNodes() {
      const container = document.getElementById('nodesContainer');
      container.innerHTML = '';

      if (!clusterNodes || clusterNodes.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-8 px-4 rounded-xl border border-dashed border-zinc-800 text-center text-zinc-500 text-xs font-mono">
            No active nodes. Click "+ Add Node" to spin up a TCP Bloom node.
          </div>
        `;
        return;
      }

      clusterNodes.forEach((node, idx) => {
        const color = NODE_PALETTE[idx % NODE_PALETTE.length];
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition-colors ${
          node.online 
            ? 'bg-zinc-900/80 border-zinc-800 hover:border-zinc-700/80 shadow-sm' 
            : 'bg-zinc-950/40 border-zinc-800/50 opacity-60'
        }`;

        const fillWidth = Math.max(node.fill_pct > 0 ? 1 : 0, Math.min(100, node.fill_pct));
        const keysHtml = node.keys && node.keys.length > 0
          ? node.keys.slice(-4).map(k => `<span class="px-2 py-0.5 text-[11px] rounded bg-zinc-950 text-zinc-300 font-mono border border-zinc-800/90 truncate max-w-[120px] font-medium">${k}</span>`).join('')
          : '<span class="text-zinc-600 italic text-[11px] font-mono">No keys stored</span>';

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full shrink-0 ring-2 ring-white/10" style="background-color: ${color}"></span>
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-sm text-zinc-100 truncate">${node.name}</span>
                  <span class="text-[10px] font-mono font-medium px-2 py-0.5 rounded ${
                    node.online 
                      ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                      : 'bg-zinc-800 text-zinc-400 border border-zinc-700/60'
                  }">
                    ${node.online ? 'ONLINE' : 'OFFLINE'}
                  </span>
                </div>
                <span class="text-xs font-mono text-zinc-400 block truncate">${node.host}</span>
              </div>
            </div>
            <button onclick="toggleNode('${node.id}')" class="shrink-0 px-2.5 py-1 text-xs rounded-lg font-medium transition-colors border ${
              node.online 
                ? 'bg-zinc-800/80 hover:bg-red-950/40 text-zinc-300 hover:text-red-400 border-zinc-700 hover:border-red-800/60' 
                : 'bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-400 border-emerald-800/60'
            }">
              ${node.online ? 'Kill Server' : 'Start Server'}
            </button>
          </div>

          <!-- Saturation Progress -->
          <div class="space-y-1.5 mb-3 bg-zinc-950/60 p-2.5 rounded-lg border border-zinc-800/80">
            <div class="flex justify-between text-xs font-mono">
              <span class="text-zinc-400 text-xs font-medium">Bit Saturation</span>
              <span class="text-zinc-200 font-semibold text-xs">${node.set_bits} / ${(node.m || 0).toLocaleString()} bits (${node.fill_pct}%)</span>
            </div>
            <div class="w-full bg-zinc-800/80 rounded-full h-1.5 overflow-hidden">
              <div class="bg-rose-500/90 h-1.5 rounded-full transition-all duration-300" style="width: ${fillWidth}%"></div>
            </div>
          </div>

          <!-- Metrics Grid -->
          <div class="grid grid-cols-3 gap-1.5 text-center text-xs mb-3">
            <div class="bg-zinc-950/60 p-2 rounded-lg border border-zinc-800/80">
              <div class="text-zinc-500 text-[10px] uppercase tracking-wider font-mono font-medium">Memory</div>
              <div class="font-mono text-zinc-200 text-xs font-semibold mt-0.5">${((node.memory_bytes || 0) / 1024).toFixed(1)} KB</div>
            </div>
            <div class="bg-zinc-950/60 p-2 rounded-lg border border-zinc-800/80">
              <div class="text-zinc-500 text-[10px] uppercase tracking-wider font-mono font-medium">Est. FPR</div>
              <div class="font-mono text-amber-400/90 text-xs font-semibold mt-0.5">${node.est_fpr}%</div>
            </div>
            <div class="bg-zinc-950/60 p-2 rounded-lg border border-zinc-800/80">
              <div class="text-zinc-500 text-[10px] uppercase tracking-wider font-mono font-medium">Capacity</div>
              <div class="font-mono text-sky-400/90 text-xs font-semibold mt-0.5">${node.capacity}</div>
            </div>
          </div>

          <!-- Stored Keys -->
          <div class="pt-2 border-t border-zinc-800/80">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-xs font-medium text-zinc-400 uppercase tracking-wider font-mono">Routed Keys (${(node.keys || []).length})</span>
            </div>
            <div class="flex flex-wrap gap-1">
              ${keysHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateStats() {
      const active = clusterNodes.filter(n => n.online).length;
      const centerStatus = document.getElementById('centerStatus');
      if (centerStatus) {
        centerStatus.textContent = `${active} Active Node${active !== 1 ? 's' : ''}`;
      }
      const centerVnodes = document.getElementById('centerVnodes');
      if (centerVnodes) {
        centerVnodes.textContent = `${vnodeRing.length} Virtual Nodes`;
      }
    }

    function handleOpResult(msg) {
      const card = document.getElementById('operationResultCard');
      card.classList.remove('hidden');

      const isAdd = msg.action === 'add';
      const targetStr = (msg.targets && msg.targets.length) ? msg.targets.join(', ') : 'None (all nodes offline)';
      const modeStr = msg.mode || '';
      const badge = document.getElementById('resultBadge');
      if (isAdd) {
        badge.textContent = msg.success ? 'ACKNOWLEDGED' : 'FAILED';
        badge.className = msg.success 
          ? 'px-2 py-0.5 rounded text-xs font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0'
          : 'px-2 py-0.5 rounded text-xs font-mono font-medium bg-red-500/10 text-red-400 border border-red-500/20 shrink-0';
        log(`TCP ADD '${msg.key}' [${modeStr}] -> Targets: [${targetStr}] -> Success: ${msg.success} (${msg.latency_ms}ms)`, msg.success ? 'add' : 'err');
      } else {
        badge.textContent = msg.found ? 'TRUE (EXISTS)' : 'FALSE (NOT FOUND)';
        badge.className = msg.found
          ? 'px-2 py-0.5 rounded text-xs font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0'
          : 'px-2 py-0.5 rounded text-xs font-mono font-medium bg-zinc-800 text-zinc-400 border border-zinc-700 shrink-0';
        log(`TCP CONTAINS '${msg.key}' [${modeStr}] -> Targets: [${targetStr}] -> Result: ${msg.found} (${msg.latency_ms}ms)`, 'query');
      }

      document.getElementById('opKey').textContent = msg.key;
      document.getElementById('opMode').textContent = modeStr;
      document.getElementById('opReplicas').textContent = targetStr;
      document.getElementById('resultLatency').textContent = `${msg.latency_ms}ms`;
      document.getElementById('ringKeyInfo').textContent = `Key: ${msg.key}`;
    }

    function log(msg, type = 'info') {
      const container = document.getElementById('logContainer');
      const placeholder = container.querySelector('.italic');
      if (placeholder) {
        container.innerHTML = '';
      }
      const entry = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      let colorClass = 'text-zinc-400';
      if (type === 'add') colorClass = 'text-rose-400 font-medium';
      if (type === 'query') colorClass = 'text-amber-300/90 font-medium';
      if (type === 'err') colorClass = 'text-red-400 font-medium';

      entry.className = `${colorClass} break-all`;
      entry.innerHTML = `<span class="text-zinc-500">[${time}]</span> ${msg}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }

    function setKey(k) {
      document.getElementById('keyInput').value = k;
    }

    function performAdd() {
      const key = document.getElementById('keyInput').value.trim();
      const choice = document.getElementById('repSelect').value;
      if (!key || !ws) return;
      ws.send(JSON.stringify({ action: 'add', key, choice }));
    }

    function performContains() {
      const key = document.getElementById('keyInput').value.trim();
      const choice = document.getElementById('repSelect').value;
      if (!key || !ws) return;
      ws.send(JSON.stringify({ action: 'contains', key, choice }));
    }

    function toggleNode(nodeId) {
      if (!ws) return;
      ws.send(JSON.stringify({ action: 'toggle_node', node_id: nodeId }));
    }

    function addRandomNode() {
      if (!ws) return;
      ws.send(JSON.stringify({ action: 'add_node' }));
    }

    function syncAllNodes() {
      if (!ws) return;
      ws.send(JSON.stringify({ action: 'sync' }));
    }

    function clearLogs() {
      document.getElementById('logContainer').innerHTML = '<div class="text-zinc-600 italic">Logs cleared. Waiting for cluster events...</div>';
    }

    connectWebSocket();
  </script>
</body>
</html>
